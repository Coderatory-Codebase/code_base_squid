      # for technology skills, generalized); SPEC-011 gained a
      # project/foundation boundary check and a FOUNDATION/PROJECT/BOTH
      # trace classification; SPEC-013 gained a matching checkpoint field.
      # A genuine corrective review of M22 (not a blind re-approval) found
      # two real record-keeping gaps M22 itself should have caught —
      # AGENTS.md's stale "authentication"/"web app" non-goals and
      # ARTIFACT-TYPES.md's stale backlog/-not-yet-created language — both
      # fixed. Three genuinely new backlog items surfaced by this review
      # (rate limiting, audit logging, MFA/2FA/passkeys — BACKLOG-006..008),
      # not manufactured. TRACE-006 (this milestone's own execution)
      # includes a real 10-scenario cold-start run. See
      # .project/state/PROJECT-STATE.md.
      deliverables:
        [
          .project/decisions/ADR-013,
          .project/specs/SPEC-008 (Use vs. build vs. adopt added),
          .project/specs/SPEC-010 (Phase determination added,
          Persistence corrected),
          .project/specs/SPEC-011 (project/foundation boundary check + classification added),
          .project/specs/SPEC-012 (Implementation-area skills added),
          .project/specs/SPEC-013 (classification checkpoint field added),
          .agent/skills/README.md (Implementation-area skills section added),
          .agent/instructions/boundaries.md (project-ownership checklist item added),
          .agent/instructions/agent-operating-contract.md (sequence updated),
          .agent/instructions/backlog-and-feature-development.md (updated),
          .agent/instructions/engineering-standards.md (updated),
          .agent/instructions/traceability.md (updated),
          AGENTS.md (stale non-goals corrected),
          .project/ARTIFACT-TYPES.md (backlog persistence + staleness corrected),
          apps/test/web + servers/test/api (migrated from apps/web + servers/api),
          .project/backlog/BACKLOG.md (BACKLOG-006,
          BACKLOG-007,
          BACKLOG-008 added),
          .project/traces/TRACE-006,
        ]
    - id: M24
      name: Autonomous Engineering Operating Model
      status: complete
      # Not a rename — commissioned to inspect the operating model as a
      # system (not file-by-file), using M21-M23 plus the real
      # Authentication/Rate-Limiting/Profile work and its own audit
      # (TRACE-009/010) as behavioral evidence, not assuming correctness
