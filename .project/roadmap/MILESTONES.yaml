      # No new SPEC, no new ADR, no new skill, no backlog item. See
      # .project/state/PROJECT-STATE.md.
      deliverables: [
          .project/specs/SPEC-012 (tooling-scope clarification,
          framework-fact vs. principle
          distinction added),
          .project/traces/TRACE-013,
        ]
