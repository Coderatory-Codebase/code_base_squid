# Machine-readable milestone history for this repository.
# Moved out of architecture.yaml during BACKLOG-010 / M26 so
# architecture.yaml can describe current architecture first.

version: 1
name: nut-shyll
kind: roadmap-history
moved_from: architecture.yaml
moved_at: 2026-09-05

roadmap:
  # Detailed milestone history moved here from architecture.yaml at M26
  # per ADR-015/BACKLOG-010. architecture.yaml keeps current architecture,
  # active phase, and a pointer back to this file.
  milestones:
    - id: M01
      name: Foundation Definition
      status: complete
