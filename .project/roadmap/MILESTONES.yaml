      # completion flow was already mapped, almost line for line, onto
      # existing sections, and demonstrably worked in practice (TRACE-007
      # correctly refused to silently pick a backlog item; TRACE-008
      # correctly escalated its one genuine ambiguity; TRACE-010 resolved
      # every audit finding autonomously, including one correct decision
      # NOT to apply a proposed fix). Four real, evidence-grounded gaps
      # closed, none manufactured: (1) no named "conformance review"
      # concept distinguishing "recorded a process" from "independently
      # verified" - TRACE-009 was itself the undocumented precedent;
      # (2) Security/Accessibility were not named REVIEW dimensions,
      # plausibly contributing to defects TRACE-009 later caught;
      # (3) SPEC-012's "repeated use" skill-creation criterion didn't
      # state the cross-project bar TRACE-009/010 had to derive by
      # judgment; (4) foundation-change authorization was demonstrated by
      # precedent across 6+ milestones but never stated as a rule. All
      # four are amendments to already-active SPECs (SPEC-013,
      # development-lifecycle.md/SPEC-004, SPEC-012, SPEC-011) - no new
      # SPEC, no new ADR (connective/clarifying content, same category as
      # M16/M19/M20/M21/M23), no new skill (re-confirmed, not
      # re-decided), no application code, no backlog item (no genuine
      # out-of-scope discovery occurred). A real 20-scenario cold-start
      # walkthrough confirmed all scenarios resolve without inventing a
      # mechanism, with 3 scenarios specifically exercising the 4 closed
      # gaps. See .project/state/PROJECT-STATE.md.
      deliverables:
        [
          .agent/instructions/development-lifecycle.md (Security/Accessibility review dimensions,
          Conformance review pointer,
          added),
          .project/specs/SPEC-013 (Conformance review section added),
          .agent/instructions/traceability.md (Conformance review pointer added),
          .project/specs/SPEC-012 (cross-project skill-creation bar clarified),
          .project/specs/SPEC-011 (foundation-change authorization subsection added),
          .project/traces/TRACE-011,
        ]
    - id: M25
      name: Autonomous Engineering Operating Model Audit
      status: complete
      # Not a rename — a deliberately adversarial re-audit of the
