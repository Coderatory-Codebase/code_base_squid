name: Control Plane

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test module-boundary acceptance cases
        run: node --test codebase/validators/module-governance.acceptance.test.mjs
      - name: Test recorded-exception acceptance cases
        run: node --test codebase/validators/module-governance.s2.acceptance.test.mjs
      - name: Check published event-contract compatibility
        working-directory: packages/kernel
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          snapshot=contracts/event-schemas.snapshot.json
          baseline="$RUNNER_TEMP/event-schemas-baseline.json"
          if git cat-file -e "$BASE_SHA:packages/kernel/$snapshot" 2>/dev/null; then
            git show "$BASE_SHA:packages/kernel/$snapshot" > "$baseline"
          else
            cp "$snapshot" "$baseline"
          fi
          pnpm run check:contracts -- --baseline "$baseline"
      - name: Validate pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm run commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      - name: Validate main commit
        if: github.event_name == 'push'
        run: pnpm run commitlint --last --verbose
      - name: Run validate
        run: pnpm run validate
        continue-on-error: true
