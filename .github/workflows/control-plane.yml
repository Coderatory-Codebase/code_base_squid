name: Control Plane

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.29.1
        run: |
          curl --fail --silent --show-error --location --output gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz$" checksums.txt | sha256sum --check
          tar --extract --gzip --file gitleaks.tar.gz gitleaks
          install --mode 0755 gitleaks /usr/local/bin/gitleaks
      - run: pnpm run node:check
      - run: pnpm test
      - run: pnpm run repo -- profile ${{ github.event_name == 'pull_request' && 'pull-request' || 'main' }} --json
