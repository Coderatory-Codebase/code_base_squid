name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — needed to diff PR commit ranges below

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # One command, same one a developer/agent runs locally — see
      # SPEC-009 -> "CI command reuse (M14)". Covers lint, typecheck,
      # test, build, validate:architecture, secrets:scan, in that order;
      # CI does not re-list each rule separately.
      - run: pnpm run validate
      - run: pnpm run format:check
      - name: Validate commit messages (PR range)
        if: github.event_name == 'pull_request'
        run: >
          node tooling/scripts/validate-commit-messages-in-range.mjs
          ${{ github.event.pull_request.base.sha }}
          ${{ github.event.pull_request.head.sha }}
