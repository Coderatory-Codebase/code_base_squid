{
  "version": 1,
  "foundation": {
    "name": "monorepo-foundation",
    "projectManifest": "project.json",
    "projectRoots": {
      "apps": "app",
      "servers": "server",
      "packages": "package",
      "prebuilt": "prebuilt"
    },
    "requiredRoots": ["apps", "servers", "packages", "prebuilt", "codebase", "enablers", ".agent", ".project", ".github"],
    "requiredFiles": ["AGENTS.md", "CLAUDE.md", "architecture.yaml", "package.json", "pnpm-workspace.yaml", "pnpm-lock.yaml"],
    "disallowedOrchestrators": ["turbo", "turborepo", "nx", "lerna"],
    "ignoredDirectories": [".git", ".next", ".repo-cache", "node_modules", "dist", "build", "coverage"]
  },
  "workspaceModel": {
    "repositoryIsWorkspace": true,
    "mandatoryProjectNamespace": false,
    "defaultUnits": {
      "app": "apps/web",
      "server": "servers/api"
    },
    "additionalUnits": "when-required"
  },
  "growthModel": {
    "principle": "everything-available-nothing-unnecessarily-imposed",
    "progression": ["simple", "modular", "bounded", "scalable", "distributed-when-justified", "platform-when-justified"]
  },
  "toolingModel": {
    "principle": "custom-orchestration-standard-engines",
    "controlPlaneOwns": ["discovery", "dependency-graph", "execution-planning", "task-orchestration", "caching", "repository-policy", "result-normalization", "cli"],
    "standardEngines": {
      "packageManagement": "pnpm",
      "typescript": "tsc",
      "lint": "eslint",
      "tests": "project-declared-runner",
      "dependencySecurity": "pnpm-audit",
      "secretDetection": "gitleaks"
    }
  },
  "featureModel": {
    "ownership": "feature-first",
    "growth": "progressive",
    "serverLayout": "flat-files-by-default",
    "optionalServerFileRoles": ["route", "controller", "service", "repository", "validation", "model", "integration"],
    "domainDirectory": "domain",
    "domainFileRoles": ["entity", "rules", "policy", "calculations", "commands", "queries", "events", "constants"]
  },
  "boundaries": {
    "packagesCannotImport": ["apps", "servers", "prebuilt"],
    "workspaceUnitCannotImport": {
      "app": ["servers", "prebuilt"],
      "server": ["apps", "prebuilt"],
      "package": ["apps", "servers", "prebuilt"]
    },
    "domainCannotImportSegments": ["controllers", "routes", "models"],
    "domainCannotImportFileRoles": ["route", "controller", "service", "repository", "validation", "model", "integration"],
    "domainCannotImportPackages": ["express", "mongoose", "next", "redis"],
    "serviceCannotImportSegments": ["routes", "controllers", "ui", "components"],
    "serviceCannotImportFileRoles": ["route", "controller", "model"],
    "uiSegments": ["components", "ui"],
    "persistenceSegments": ["models", "persistence", "repositories"],
    "persistenceFileRoles": ["model", "repository"],
    "serverDisallowedSegments": ["observability"]
  },
  "typescript": {
    "disallowExplicitAny": true,
    "requiredTypeBoundaryProjectTypes": ["app", "server"],
    "requiredCompilerOptions": [
      "strict",
      "noImplicitAny",
      "strictNullChecks",
      "noImplicitReturns",
      "noImplicitOverride",
      "noUncheckedIndexedAccess",
      "exactOptionalPropertyTypes",
      "useUnknownInCatchVariables"
    ]
  },
  "configuration": {
    "environmentValidationFile": "validation/env.validation.ts",
    "forbidDefaultsInEnvironmentValidation": true,
    "validationPackages": ["zod"]
  },
  "uiComposition": {
    "packageProject": "ui",
    "primitiveRoot": "src/primitives",
    "genericRoots": ["src/components", "src/compositions"],
    "genericFiles": [],
    "applicationRoots": ["components/workspace"],
    "appForbiddenGenericRoots": ["components/ui", "components/layout", "components/feedback"],
    "featureRoot": "features",
    "shadcnPrimitiveNames": [
      "alert",
      "avatar",
      "badge",
      "button",
      "card",
      "dialog",
      "dropdown-menu",
      "form",
      "input",
      "label",
      "select",
      "separator",
      "sheet",
      "skeleton",
      "tabs",
      "tooltip"
    ]
  },
  "integrations": {
    "serverDirectory": "integrations",
    "externalImplementationPackages": ["mongoose", "redis", "stripe"]
  },
  "packageManagement": {
    "manager": "pnpm",
    "packageManagerVersion": "11.19.0",
    "workspaceFile": "pnpm-workspace.yaml",
    "workspacePatterns": ["apps/*", "servers/*", "packages/*", "prebuilt/*"],
    "allowedBuildDependencies": ["esbuild", "unrs-resolver"],
    "lockfile": "pnpm-lock.yaml",
    "forbiddenLockfiles": ["package-lock.json", "yarn.lock"],
    "internalDependencyProtocol": "workspace:"
  },
  "security": {
    "model": "standard-engines-repository-policy",
    "dependencyAudit": {
      "engine": "pnpm-audit",
      "minimumSeverity": "high"
    },
    "secretScan": {
      "engine": "gitleaks",
      "version": "8.29.1",
      "configuration": ".gitleaks.toml"
    }
  },
  "moduleBoundaries": [
    { "project": "web", "root": "components", "categories": ["workspace"], "rootExports": ["workspace"] },
    { "project": "web", "root": "types", "categories": ["configuration", "routing"], "rootExports": ["configuration", "routing"] },
    { "project": "api", "root": "integrations", "categories": ["mongodb"], "rootExports": ["mongodb"] },
    { "project": "api", "root": "constants", "categories": ["errors", "http", "runtime"], "rootExports": ["errors", "http", "runtime"] },
    { "project": "api", "root": "types", "categories": ["configuration"], "rootExports": ["configuration"] },
    { "project": "types", "root": "src", "categories": ["api", "errors"], "rootExports": ["api", "errors"] },
    { "project": "ui", "root": "src", "categories": ["components", "compositions", "primitives", "utilities"], "rootExports": ["components", "compositions", "primitives"] }
  ],
  "contractOwnership": {
    "sharedTypesRoot": "packages/types",
    "sharedValidationRoot": "packages/validation",
    "extractionRule": "genuine-cross-boundary-reuse"
  },
  "testingModel": {
    "principle": "behavior-and-boundaries-not-files",
    "levels": ["unit", "component", "integration", "e2e"]
  },
  "programmingModel": {
    "prefer": ["pure-functions", "immutable-data", "composition", "explicit-dependencies"],
    "avoid": ["inheritance", "dependency-injection-containers", "mutable-global-state"]
  }
}
