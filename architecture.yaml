# Machine-readable architectural definition for this repository.
# Human-facing rationale lives in README.md. Agent operating rules live in
# AGENTS.md / CLAUDE.md. This file is the source of truth for boundaries,
# dependency direction, and milestone state — keep it consistent with those
# other three root documents.

version: 1
name: nut-shyll
kind: foundation-monorepo

principles:
  - id: packages-are-the-reuse-mechanism
    statement: >
      There is no generic top-level `modules/` directory. Reusable
      capability lives in packages/. Business/domain logic lives inside the
      deployable (apps/servers/agents) that owns it, until proven reusable
      across independent systems.
  - id: agent-agnostic-core
    statement: >
      Artifacts, contracts, workflows, skills, policies, and project state
      must remain usable by any coding agent. Agent-specific integration is
      confined to adapter/instruction files (e.g. CLAUDE.md), never baked
      into the core structures.
  - id: composable-architecture
    statement: >
      No single architectural methodology (DDD, hexagonal, CQRS, vertical
      slice, event-driven, modular monolith, microservices, ...) is mandated
      repo-wide. Each deployable selects the pattern(s) it needs.
  - id: progressive-disclosure
    statement: >
      Context loads on demand: CLAUDE.md -> repo orientation -> relevant
      instruction -> relevant workflow/skill -> relevant project artifact ->
      relevant source. CLAUDE.md stays intentionally small.
  - id: explicit-boundaries
    statement: >
      Every top-level directory has one stated purpose. Directories are
      created only when a concrete capability requires them, never
      speculatively.
  - id: decisions-are-recorded
    statement: >
      Non-trivial architectural decisions are recorded as ADRs in
      .project/decisions/ (see .project/ARTIFACT-TYPES.md for the
      convention). Silent architectural changes are disallowed.

boundaries:
  - path: .agent/
    purpose: Repository-level agent operating system — how agents operate.
    contains: [instructions, workflows, skills, templates]
    is_runtime_code: false
    status: created

  - path: .project/
    purpose: Persistent engineering/project memory — what the project knows.
    contains:
      [
        context,
        specs,
        decisions,
        plans,
        tasks,
        changes,
        research,
        reviews,
        reports,
        sessions,
        state,
        backlog,
        traces,
      ]
    created: [state, decisions, specs, plans, reviews, traces]
    # Remaining entries in `contains` are defined conventions
    # (.project/ARTIFACT-TYPES.md) without a directory yet — created on
    # first real need, not pre-scaffolded. See .project/README.md.
    is_runtime_code: false
    status: partially-created

  - path: apps/
    purpose: User-facing deployable applications.
    examples: [web, admin, mobile]
    contains: [web]
    status: created
    # First populated with the Authentication feature (ADR-012): web is
    # a Next.js/React app, the browser-facing side of the first real
    # application. Talks to servers/api only through its own /api/**
    # rewrite proxy, never imports servers/api's source directly.

  - path: servers/
    purpose: >
      Deployable server processes. Business/domain logic owned by a backend
      lives here, inside the server that owns it (e.g. servers/api/domains/*).
    examples: [api, worker, gateway]
    contains: [api]
    status: created
    # First populated with the Authentication feature (ADR-012): api is
    # the Express/Node/MongoDB (Mongoose) server; owns auth domain logic
    # and the auth request/response contract (servers/api/src/domains/auth/*).

  - path: agents/
    purpose: >
      Deployable / independently executable agent applications and runtimes.
      Distinct from .agent/, which is the engineering operating system, not
      a runtime.
    status: not-yet-created

  - path: packages/
    purpose: >
      Reusable SOURCE capabilities: infrastructure, protocols, transports,
      platform integrations, libraries, runtime primitives, shared
      contracts, utilities. The primary reuse boundary in this repo — but
      NOT a nested monorepo: a package under packages/<name>/ does not
      require its own package.json, tsconfig.json, or build/release
      config unless it genuinely needs independent versioning/publishing.
      The default is direct source consumption by whatever depends on it.
      If a package is ever built for distribution, its output lives
      outside the package's own source directory (e.g. a repository-level
      dist/<name>/), never inside packages/<name>/. See ADR-008.
    status: not-yet-created

  - path: infra/
    purpose: Infrastructure and deployment configuration.
    examples: [docker, kubernetes, terraform, environments]
    status: not-yet-created

  - path: tooling/
    purpose: Repository/developer tooling.
    examples: [generators, scripts, lint, build]
    contains: [git-hooks, scripts]
    status: created
    # First populated at M13: commit-msg/pre-commit/pre-push Git hooks
    # (installed via core.hooksPath, no third-party hook manager — see
    # ADR-009) and the validation scripts they and CI both call
    # (validate-architecture-boundaries.mjs, secret-scan.mjs,
    # commit-message-rules.mjs). No generator/build tooling yet — added
    # only once a concrete need creates one.

  - path: docs/
    purpose: Human-facing documentation.
    status: not-yet-created

forbidden_top_level_dirs:
  - modules
  - services
  - business-services
  - domain-services
  # Business/domain logic belongs inside the owning deployable
  # (servers/<name>/domains/*, apps/<name>/features/*, etc.), not in a
  # generic root-level bucket.

dependency_direction:
  statement: >
    apps, servers, agents, and tooling may depend on packages. packages must
    not depend on apps, servers, or agents. This is a source/import
    direction, not a build or publish direction — packages/ is consumed
    directly from source by default (see boundaries -> packages/, ADR-008).
    Circular dependencies are disallowed. A package is introduced to hold a
    genuine reusable capability, never merely to break a poorly designed
    dependency graph — if a cycle appears, the boundary is reconsidered
    first.
  allowed:
    - from: apps
      to: packages
    - from: servers
      to: packages
    - from: agents
      to: packages
    - from: tooling
      to: packages
    - from: packages
      to: packages
  disallowed:
    - from: packages
      to: [apps, servers, agents]

agent_native_lifecycle:
  loop: [Observe, Understand, Plan, Act, Test, Verify, Record]
  implementation_flow: [SPEC, PLAN, TASK, IMPLEMENT, TEST, REVIEW, DOCUMENT]
  status: >
    Realized as a documented protocol at M06 (work-level lifecycle: see
    .agent/instructions/development-lifecycle.md, SPEC-004) and M08
    (iterative reasoning nested inside it: see
    .agent/instructions/development-loop.md, SPEC-006 — Observe ->
    Understand -> Hypothesize -> Plan -> Change -> Verify -> Evaluate).
    Both are documentation/protocol, not a runtime. No orchestration or
    execution engine exists or is scheduled at any specific milestone —
    one is added only if a concrete need ever justifies it.

roadmap:
  # M23 has no milestone entry below and none is added speculatively —
  # the original M01 roadmap sketch ended at M14 (renamed at M12/M13/M14
  # from its original placeholder names to each milestone's actual
  # content); M15 through M22 were all added beyond that sketch because
  # real gaps existed or real feature work was commissioned, not to keep
  # a numbered roadmap alive. The next milestone is defined only once a
  # concrete need identifies one — see .project/state/PROJECT-STATE.md
  # -> "Roadmap position".
  current_phase: M23
  milestones:
    - id: M01
      name: Foundation Definition
      status: complete
      deliverables: [README.md, architecture.yaml, AGENTS.md, CLAUDE.md]
    - id: M02
      name: Repository Bootstrap
      status: complete
      deliverables:
        [pnpm-workspace.yaml, package.json, tsconfig.json, lint/format config, CI foundation]
    - id: M03
      name: Claude Agent Bootstrap
      status: complete
      deliverables: [.agent/instructions, .agent/workflows, .agent/skills, .agent/templates]
    - id: M04
      name: Project Artifact System
      status: complete
      deliverables:
        [
          .project/ARTIFACT-TYPES.md,
          .project/state,
          .project/decisions,
          .project/specs,
          .project/plans,
          .project/reviews,
        ]
    - id: M05
      name: Contract System
      status: complete
      # Corrected after initial implementation: no universal Contract
      # runtime abstraction, no centralized/independently-built
      # packages/contracts. See ADR-007 (superseded), ADR-008, SPEC-003.
      deliverables:
        [.agent/instructions/contracts.md, .project/decisions/ADR-008, .project/specs/SPEC-003]
    - id: M06
      name: Workflow System
      status: complete
      deliverables:
        [
          .agent/instructions/development-lifecycle.md,
          .project/specs/SPEC-004,
          .agent/workflows (simplified to reference the shared lifecycle),
        ]
    - id: M07
      name: Skill System
      status: complete
      deliverables:
        [
          .agent/instructions/capability-model.md,
          .agent/skills/README.md (expanded),
          .project/specs/SPEC-005,
        ]
      # No new skill created — validate-repository remains the only one;
      # no genuine second capability was demonstrated. See ADR/SPEC log
      # and .project/state/PROJECT-STATE.md.
    - id: M08
      name: Development Loops
      status: complete
      # Protocol/instruction only, per its own brief — not a runtime.
      deliverables: [.agent/instructions/development-loop.md, .project/specs/SPEC-006]
    - id: M09
      name: Graph System
      status: complete
      # Model/semantics only, per its own brief — no graph engine,
      # database, or .project/graph/ directory. See SPEC-007.
      deliverables: [.agent/instructions/engineering-graph.md, .project/specs/SPEC-007]
    - id: M10
      name: Package Source Model
      status: complete
      # Renamed from the original roadmap's "Core Packages" (M11) —
      # swapped with "MCP Integration" since neither had started; this
      # milestone's actual content matched the original M11, not M10.
      # See .project/state/PROJECT-STATE.md for the swap rationale.
      deliverables: [.agent/instructions/packages.md, .project/specs/SPEC-003 (amended)]
      # No package created — nothing in the repository yet meets the
      # demonstrated-reuse extraction bar (ADR-008). Model/convention only.
    - id: M11
      name: Architecture Validation & Boundary Integrity
      status: complete
      deliverables:
        [
          .project/state/PROJECT-STATE.md (corrected),
          architecture.yaml (corrected),
          AGENTS.md (corrected),
          .agent/instructions/boundaries.md (corrected),
        ]
      # Consolidation gate, not a new subsystem. "MCP Integration"
      # (previously slotted here after the M10 swap) is removed from the
      # numbered roadmap entirely: MCP has no concrete requirement in
      # this repository and must not occupy a roadmap slot until one
      # exists (see AGENTS.md -> "Non-goals right now", SPEC-001 ->
      # non-goals). M12+ below is a non-binding long-range reference only
      # — the next real milestone is decided when a concrete need exists.
    - id: M12
      name: Engineering Standards, Design & Practice Model
      status: complete
      # Renamed from the original roadmap sketch's "Project Scaffolder" —
      # that label had no concrete requirement. Establishes the
      # technology-neutral engineering/design judgment layer between this
      # file's structural boundaries and real implementation, plus the
      # technology-skill mechanism (skills scoped to one technology,
      # loaded only when that technology is actually involved). No
      # technology skill created — no implementation technology exists in
      # this repository yet. See .project/state/PROJECT-STATE.md.
      deliverables:
        [
          .project/specs/SPEC-008,
          .agent/instructions/engineering-standards.md,
          .agent/skills/README.md (Technology skills section added),
        ]
    - id: M13
      name: Repository Structure, Git Governance & Quality Enforcement
      status: complete
      # Renamed from the original roadmap sketch's "Self-Hosting" — that
      # label had no concrete requirement. Establishes and *implements*
      # (not just documents) the Git/quality enforcement layer: real
      # commit-msg/pre-commit/pre-push hooks (ADR-009), an expanded
      # `pnpm run validate` (+ validate:architecture, + secrets:scan), and
      # a CI job that runs the same commands plus a PR commit-range check.
      # tooling/ boundary populated for the first time. No technology-
      # specific tooling added — none is in use yet (SPEC-008 ->
      # "Project technology profile"). See .project/state/PROJECT-STATE.md.
      deliverables:
        [
          .project/specs/SPEC-009,
          .project/decisions/ADR-009,
          .agent/instructions/git-governance.md,
          tooling/git-hooks (commit-msg,
          pre-commit,
          pre-push),
          tooling/scripts (secret-scan,
          architecture validation,
          commit-message rules,
          hook installer),
          .github/workflows/ci.yaml (extended),
          .gitattributes (new),
        ]
    - id: M14
      name: Autonomous Repository Engineering Tooling
      status: complete
      # Renamed from the original roadmap sketch's "Production Hardening"
      # — that label had no concrete requirement (no production system
      # exists to harden). This milestone matured M13's implementation:
      # staged-file-scoped pre-commit checks, CI reusing `pnpm run
      # validate` instead of duplicating its rule list, a deliberate
      # hook-management evaluation (native hooks vs. Husky/Lefthook,
      # reaffirmed — see ADR-009 addendum), a real fresh-clone
      # installation test, and tooling/README.md for onboarding. No new
      # ADR (evaluation appended to the existing ADR-009, not a new
      # decision). No technology-specific tooling added — none is in use
      # yet. See .project/state/PROJECT-STATE.md.
      deliverables:
        [
          .project/specs/SPEC-009 (amended),
          .project/decisions/ADR-009 (amended),
          tooling/README.md (new),
          tooling/git-hooks/pre-commit (staged-scoped),
          .github/workflows/ci.yaml (simplified to reuse `pnpm run validate`),
        ]
    - id: M15
      name: Agent Backlog & Feature-Driven Development Model
      status: complete
      # Not a rename — the original M01 roadmap sketch ended at M14; this
      # is the first milestone added because a real gap existed (no
      # work-management model for actual feature implementation).
      # Establishes a single, repository-native backlog (BACKLOG-<NNN>,
      # not multiple audience-specific backlogs — see ADR-010), the
      # backlog/feature/task/RFC/SPEC boundary, feature-driven
      # development integrated with the existing lifecycle/loop (not a
      # replacement), and the central rule that discovery does not
      # automatically become implementation scope. Adds one engineering-
      # graph relationship type (discovered-from, SPEC-007) for backlog
      # provenance. No backlog item created — nothing has been
      # implemented yet to discover or defer work from. See
      # .project/state/PROJECT-STATE.md.
      deliverables:
        [
          .project/specs/SPEC-010,
          .project/decisions/ADR-010,
          .agent/instructions/backlog-and-feature-development.md,
          .project/ARTIFACT-TYPES.md (BACKLOG type added),
          .project/specs/SPEC-007 (discovered-from relationship added),
        ]
    - id: M16
      name: Agent Repository Operating Contract
      status: complete
      # Not a rename — added because a real gap existed: the M01-M15
      # operating model was correct but not connected into one
      # discoverable bootstrap sequence. A cold-start audit against 6
      # scenarios found exactly 2 real discoverability gaps (CLAUDE.md's
      # stale, drifting duplicate of AGENTS.md's checklist; a repository-
      # orientation.md instruction unreferenced from the entry chain) —
      # both fixed. SPEC-011 maps the bootstrap sequence onto M01-M15's
      # existing pieces by pointer, confirming SPEC-008's guidance-
      # precedence hierarchy already covers what this milestone asked to
      # define. No new lifecycle/loop/standards/Git-governance/backlog
      # content — those remain authoritative and unchanged. No new ADR
      # (same category as M11: consolidation, not a new decision). See
      # .project/state/PROJECT-STATE.md.
      deliverables:
        [
          .project/specs/SPEC-011,
          .agent/instructions/agent-operating-contract.md,
          CLAUDE.md (trimmed — stale duplicate checklist removed),
          AGENTS.md (repository-orientation.md pointer added),
        ]
    - id: M17
      name: Technology Ecosystem & Guidance Governance
      status: complete
      # Not a rename — added because a real gap existed: M12 established
      # what a technology skill is and how it's structured, but not who
      # decides one should exist or when creating one needs a human.
      # Establishes the ecosystem-vs-project boundary (a project's
      # implementation choice never silently becomes ecosystem policy),
      # explicit skill creation/non-creation criteria, a hard human-
      # approval requirement for durable skill creation/change, and
      # conflict handling — all built on SPEC-008's existing precedence
      # and technology-skill model, not a competing hierarchy. No
      # technology skill created — zero technologies are adopted. No new
      # ADR (same category as M07/M12/M16). See
      # .project/state/PROJECT-STATE.md.
      deliverables:
        [
          .project/specs/SPEC-012,
          .agent/instructions/technology-guidance.md,
          .agent/skills/README.md (SPEC-012 pointer added),
          AGENTS.md (technology-guidance.md pointer added),
          .project/state/PROJECT-STATE.md (Technology profile clarified),
        ]
    - id: M18
      name: Agent Execution Traceability & Repository Operating Record
      status: complete
      # Not a rename — added because a real gap existed: nothing recorded
      # how a piece of agent work was actually done in a durable,
      # auditable way. Establishes TRACE-<NNN> as observational, never
      # authoritative — references ADR/SPEC/BACKLOG/PLAN/REVIEW/Git
      # rather than duplicating them; proportional to work significance;
      # decision provenance (human/agent/existing-rule/external-guidance/
      # validation-result); integrity rules against claiming what didn't
      # happen. One real trace created (TRACE-001, this milestone's own
      # execution) — not left hypothetical, not retroactively applied to
      # M01-M17. One new ADR (ADR-011 — repository-native persistence,
      # same category as ADR-010). See .project/state/PROJECT-STATE.md.
      deliverables:
        [
          .project/specs/SPEC-013,
          .project/decisions/ADR-011,
          .agent/instructions/traceability.md,
          .project/traces/TRACE-001,
          .project/ARTIFACT-TYPES.md (TRACE type added),
          .project/specs/SPEC-007 (TRACE node type added),
        ]
    - id: M19
      name: Operating-Model Execution Traceability
      status: complete
      # Not a rename — added because a real gap existed: M18's TRACE-001
      # showed a trace could name which lifecycle stage something
      # happened in, but not how that stage actually executed (what was
      # decided and why, what failed and how it was fixed) — and that
      # TRACE-001 itself was assembled mostly near the end rather than
      # written alongside the work. Adds a checkpoint field structure
      # (SPEC-013 -> "Checkpoint structure") and a hard progressive-
      # recording rule to the same TRACE artifact type — no second trace
      # type, no new lifecycle. TRACE-002 (this milestone's own
      # execution) is the first trace actually written checkpoint by
      # checkpoint, including a real, honestly-recorded format:check
      # failure and fix. No new ADR — an addition to SPEC-013's existing
      # model, not a new decision between real alternatives (same
      # category as M14's ADR-009 addendum). See
      # .project/state/PROJECT-STATE.md.
      deliverables:
        [
          .project/specs/SPEC-013 (checkpoint structure + progressive recording added),
          .agent/instructions/traceability.md (updated),
          .project/ARTIFACT-TYPES.md (TRACE entry clarified),
          .project/traces/TRACE-002,
        ]
    - id: M20
      name: Continuous Discovery & Backlog Capture
      status: complete
      # Not a rename — added because a real gap existed: a trace could
      # say a discovery happened without it producing an explicit
      # outcome, so meaningful future work could be noticed and then
      # forgotten. Amends SPEC-010 (already the backlog/feature-
      # development authority) with a five-outcome "Discovery decision
      # model" (needed now / decision required / future work / already
      # tracked / rejected), an expanded meaningful-discovery threshold,
      # explicit cross-cutting framing (discovery happens at any stage,
      # not only ANALYZE/IMPLEMENT), and a completion-time reconciliation
      # check — no new SPEC, no new backlog taxonomy, no new lifecycle
      # stage, no ADR. TRACE-003 (this milestone's own execution)
      # honestly records zero genuine discoveries rather than
      # manufacturing a BACKLOG item to demonstrate the mechanism. See
      # .project/state/PROJECT-STATE.md.
      deliverables:
        [
          .project/specs/SPEC-010 (discovery decision model + threshold + reconciliation added),
          .agent/instructions/backlog-and-feature-development.md (updated),
          .agent/instructions/development-lifecycle.md (completion-criteria bullet added),
          .project/specs/SPEC-013 (cross-reference added),
          .project/ARTIFACT-TYPES.md (BACKLOG entry clarified),
          .project/traces/TRACE-003,
        ]
    - id: M21
      name: Autonomous Agent Execution & Technology Discovery
      status: complete
      # Not a rename — added because the user redirected before the
      # first real application: strengthen the operating model so an
      # agent can derive request classification, planning necessity,
      # human-escalation points, and technology/skill handling from the
      # repository itself, before building Authentication. A cold-start
      # audit (same discipline as M16's, one new scenario) found most of
      # the requested behavior already existed (feature slicing,
      # missing-skill handling, discovery capture, progressive tracing,
      # engineering-lens selection, Git governance) and needed only
      # connecting, not duplicating. Four genuine gaps fixed: no request-
      # classification step, no explicit "is planning required" gate, no
      # single discoverable index of human-in-the-loop triggers, and no
      # agent-agnostic statement of manual/UI verification (previously
      # Claude-Code-specific only, a real ADR-006 gap). All four fixed as
      # amendments to SPEC-011/development-lifecycle.md/validation.md —
      # no new SPEC, no new ADR (same category as M16/M19/M20). TRACE-004
      # (this milestone's own execution) includes a real, executed
      # cold-start simulation of "Build a new authentication feature
      # using the application's current technology stack" as its own
      # checkpoint, confirming all 20 elements the milestone's own
      # completion criteria named are reachable without the user naming
      # a process. No backlog item created — no genuine, independent
      # discovery occurred. See .project/state/PROJECT-STATE.md.
      deliverables:
        [
          .project/specs/SPEC-011 (Request classification,
          Human-in-the-loop,
          scenario G added),
          .agent/instructions/agent-operating-contract.md (updated),
          .agent/instructions/development-lifecycle.md (planning-required gate added),
          .agent/instructions/validation.md (manual/UI verification bullet added),
          .project/traces/TRACE-004,
        ]
    - id: M22
      name: Authentication Feature (first application)
      status: complete
      # The repository's first real application feature, and the first
      # milestone to populate apps/ and servers/. MERN + Next.js, as the
      # user explicitly requested: apps/web (Next.js/React) and
      # servers/api (Express/Node/MongoDB via Mongoose), two independent
      # deployables (ADR-012). JWT access+refresh tokens in httpOnly
      # cookies, delivered same-origin via a Next.js rewrite proxy to
      # avoid cross-origin cookie/CORS complications. Core scope only —
      # register, login, logout, current-user, refresh, route
      # protection; email verification, password reset, OAuth, and
      # server-side refresh-token revocation are real backlog items
      # (BACKLOG-001..004), not built. This milestone was itself
      # produced by M21's operating model: classified, technology/skill-
      # checked, planned (ADR-012 + PLAN-002), implemented, and recorded
      # without the user re-stating any process — see TRACE-005. All
      # PLAN-002 acceptance criteria verified by servers/api's test
      # suite (supertest + mongodb-memory-server) and a real manual pass
      # through both dev servers. No new ADR beyond ADR-012 itself (the
      # one genuine architecture/technology decision this milestone
      # made). See .project/state/PROJECT-STATE.md.
      deliverables:
        [
          apps/web (Next.js app — login/register/dashboard,
          auth-client.ts,
          auth-server.ts),
          servers/api (Express app — domains/auth/*),
          .project/decisions/ADR-012,
          .project/plans/PLAN-002,
          .project/backlog/BACKLOG-001 through BACKLOG-005,
          .project/traces/TRACE-005,
        ]

non_goals_current_phase:
  - full agent runtime / orchestration engine
  - MCP infrastructure
  - populated package set beyond what Authentication demonstrated
  - project generator
  - graph database
  - control panel / dashboard
  - business domain implementations beyond Authentication
  - email verification / password reset / OAuth (BACKLOG-001..003)
  - server-side refresh-token revocation (BACKLOG-004)
  - speculative empty architectural layers
