# Machine-readable architectural definition for this repository.
# Human-facing rationale lives in README.md. Agent operating rules live in
# AGENTS.md / CLAUDE.md. This file is the source of truth for current
# architecture, boundaries, dependency direction, operating-model routing,
# and active phase. Milestone history is context only; it must not override
# current architecture.

version: 1
name: nut-shyll
kind: foundation-monorepo

principles:
  - id: packages-are-the-reuse-mechanism
    statement: >
      There is no generic top-level `modules/` directory. Reusable
      capability lives in packages/. Business/domain logic lives inside the
      deployable (apps/servers/agents) that owns it, until proven reusable
      across independent systems.
  - id: agent-agnostic-core
    statement: >
      Artifacts, contracts, workflows, skills, policies, and project state
      must remain usable by any coding agent. Agent-specific integration is
      confined to adapter/instruction files (e.g. CLAUDE.md), never baked
      into the core structures.
  - id: composable-architecture
    statement: >
      No single architectural methodology (DDD, hexagonal, CQRS, vertical
      slice, event-driven, modular monolith, microservices, ...) is mandated
      repo-wide. Each deployable selects the pattern(s) it needs.
  - id: progressive-disclosure
    statement: >
      Context loads on demand: CLAUDE.md -> repo orientation -> relevant
      instruction -> relevant workflow/skill -> relevant project artifact ->
      relevant source. CLAUDE.md stays intentionally small.
  - id: explicit-boundaries
    statement: >
      Every top-level directory has one stated purpose. Directories are
      created only when a concrete capability requires them, never
      speculatively.
  - id: decisions-are-recorded
    statement: >
      Non-trivial architectural decisions are recorded as ADRs in
      .project/decisions/ (see .project/ARTIFACT-TYPES.md for the
      convention). Silent architectural changes are disallowed.
  - id: project-ownership-boundary
    statement: >
      apps/, servers/, and agents/ are project-owned boundaries (ADR-013,
      added M23): a deployable lives at apps/<project>/<app>,
      servers/<project>/<server>, agents/<project>/<agent> — never
      directly under the global root. This repository exists to scaffold
      future projects (README.md); the global roots must never become a
      dumping ground where an unrelated second project's deployables sit
      as flat siblings of the first. packages/ and tooling/ are
      unaffected — they remain repository-/cross-project-level boundaries
      (ADR-008), not project-scoped.
  - id: feature-driven-seed-development
    statement: >
      The repository is a reusable foundation for agent-driven MERN/Next.js
      monorepo development. Application work proceeds as selected vertical
      feature slices: discover/analyze, record the needed backlog/spec/ADR/
      plan shape, implement across UI/API/domain/data/tests, validate,
      review, and update state. The seed application proves the foundation;
      it is not the foundation itself.
  - id: dual-operating-scope
    statement: >
      The repository has a foundation brain and each project/product has a
      scoped project brain. Agents follow the foundation first, then the
      relevant project brain. Backlog/spec/plan/trace updates must preserve
      whether work belongs to the foundation, a project/product, or both.

current_architecture:
  repository_role: >
    Agent operating foundation and starter/seed monorepo for MERN/Next.js
    applications. The reusable value is the operating layer: agent
    instructions, workflows, skills, project memory, architecture rules,
    backlog/spec/ADR/plan/trace conventions, and validation.
  seed_project:
    id: test
    role: Reference application used to prove the operating model.
    project_memory: .project/projects/test/PROJECT.md
    apps:
      - path: apps/test/web
        kind: nextjs-web
        stack: [TypeScript, Next.js, React]
        talks_to: [servers/test/api]
        integration: Same-origin /api/** rewrite proxy.
    servers:
      - path: servers/test/api
        kind: express-api
        stack: [TypeScript, Node.js, Express, MongoDB, Mongoose]
        owns_domains: [auth, session, notes, profile]
  package_model: >
    packages/ is reserved for concrete reusable source capabilities only
    after demonstrated cross-deployable reuse. No package exists yet.
  architecture_history: >
    Detailed milestone history lives in .project/roadmap/MILESTONES.yaml.
    ADR-015 decides that architecture.yaml is current architecture first;
    ADR-016 decides the dual operating-scope model. This file keeps only
    active phase and history pointers.

operating_model:
  implemented_lifecycle_phases:
    - id: INTAKE
      status: governed-workflow
      spec: .project/specs/SPEC-015-intake-lifecycle-phase.md
      workflow: .agent/workflows/intake.md
      artifact_type: REQ
      artifact_path_pattern: .project/requirements/REQ-<NNN>-<slug>.md
      behavioral_test: tooling/tests/intake.test.mjs
      state_record: .project/state/PROJECT-STATE.md
      trace_record_pattern: .project/traces/TRACE-<NNN>-<slug>.md
      transition: input -> intake/captured -> discovery
      boundary: >
        Intake captures raw business/product input and stops before
        Discovery, Specification, Decomposition, Architecture,
        Implementation, Verification, Review, Delivery, Operate, or
        Feedback.
    - id: DISCOVERY
      status: governed-workflow
      spec: .project/specs/SPEC-016-discovery-lifecycle-phase.md
      workflow: .agent/workflows/discovery.md
      artifact_type: DISC
      artifact_path_pattern: .project/discovery/DISC-<NNN>-<slug>.md
      behavioral_test: tooling/tests/discovery.test.mjs
      state_record: .project/state/PROJECT-STATE.md
      trace_record_pattern: .project/traces/TRACE-<NNN>-<slug>.md
      transition: intake/captured -> discovery/complete -> specification
      boundary: >
        Discovery consumes a completed Intake artifact, investigates
        evidence-backed context through relevant lenses, records current
        state, facts/findings/inferences/unknowns/risks/dependencies/open
        questions, identifies gaps and needed capabilities, and stops before
        Specification, Decomposition, Architecture, Implementation,
        Verification, Review, Delivery, Operate, or Feedback.
    - id: SPECIFICATION
      status: governed-workflow
      spec: .project/specs/SPEC-017-specification-lifecycle-phase.md
      workflow: .agent/workflows/specification.md
      artifact_type: SPEC
      artifact_path_pattern: .project/specs/SPEC-<NNN>-<slug>.md
      behavioral_test: tooling/tests/specification.test.mjs
      state_record: .project/state/PROJECT-STATE.md
      trace_record_pattern: .project/traces/TRACE-<NNN>-<slug>.md
      transition: discovery/complete -> specification/complete -> decomposition
      boundary: >
        Specification consumes a completed Discovery artifact, transforms
        material findings into explicit testable requirements or unresolved
        blockers, preserves traceability back to Intake and Discovery, and
        stops before Decomposition, Architecture, Implementation,
        Verification, Review, Delivery, Operate, or Feedback.
    - id: DECOMPOSITION
      status: governed-workflow
      spec: .project/specs/SPEC-019-decomposition-lifecycle-phase.md
      workflow: .agent/workflows/decomposition.md
      artifact_type: DECOMP
      artifact_path_pattern: .project/decomposition/DECOMP-<NNN>-<slug>.md
      behavioral_test: tooling/tests/decomposition.test.mjs
      state_record: .project/state/PROJECT-STATE.md
      trace_record_pattern: .project/traces/TRACE-<NNN>-<slug>.md
      transition: specification/ready -> decomposition/complete -> architecture
      boundary: >
        Decomposition consumes an active, ready Specification, breaks the
        authorized outcome into coherent feature-driven product scope units,
        represents the resulting epic/feature hierarchy in the existing
        backlog, accounts for every active requirement, preserves
        traceability, and stops before Architecture, Implementation
        Planning, Implementation, Verification, Review, Delivery, Operate,
        or Feedback.
    - id: ARCHITECTURE
      status: governed-workflow
      spec: .project/specs/SPEC-020-architecture-lifecycle-phase.md
      workflow: .agent/workflows/architecture.md
      artifact_type: ARCH
      artifact_path_pattern: .project/architecture/ARCH-<NNN>-<slug>.md
      behavioral_test: tooling/tests/architecture.test.mjs
      state_record: .project/state/PROJECT-STATE.md
      trace_record_pattern: .project/traces/TRACE-<NNN>-<slug>.md
      transition: decomposition/ready -> architecture/complete -> selected-feature-system-design
      boundary: >
        Architecture consumes Discovery evidence, an approved Specification,
        a ready Decomposition, and backlog Feature rows; distinguishes
        current technical state from target architecture; maps Features to
        architectural responsibilities and decisions; and stops before
        Feature-scoped System Design, Implementation, Verification, Review,
        Delivery, Operate, or Feedback.
    - id: SYSTEM_DESIGN
      status: governed-workflow
      spec: .project/specs/SPEC-021-system-design-lifecycle-phase.md
      workflow: .agent/workflows/system-design.md
      artifact_type: SD
      artifact_path_pattern: .project/system-design/SD-<NNN>-<slug>.md
      behavioral_test: tooling/tests/system-design.test.mjs
      state_record: .project/state/PROJECT-STATE.md
      trace_record_pattern: .project/traces/TRACE-<NNN>-<slug>.md
      transition: architecture/ready + selected-feature -> system-design/complete -> engineering-decomposition
      boundary: >
        System Design consumes exactly one selected eligible backlog Feature
        plus the relevant Specification, Decomposition, and high-level
        Architecture baseline; designs concrete behavior, interactions,
        responsibilities, data/auth/validation behavior, and architectural
        consistency for that Feature; and stops before Engineering
        Decomposition, Implementation Planning, Implementation,
        Verification, Review, Delivery, Operate, or Feedback.
    - id: ENGINEERING_DECOMPOSITION
      status: governed-workflow
      spec: .project/specs/SPEC-022-engineering-decomposition-lifecycle-phase.md
      workflow: .agent/workflows/engineering-decomposition.md
      artifact_type: ENG
      artifact_path_pattern: .project/engineering/ENG-<NNN>-<slug>.md
      behavioral_test: tooling/tests/engineering-decomposition.test.mjs
      state_record: .project/state/PROJECT-STATE.md
      trace_record_pattern: .project/traces/TRACE-<NNN>-<slug>.md
      transition: system-design/ready -> engineering-decomposition/complete -> implementation
      boundary: >
        Engineering Decomposition consumes exactly one selected eligible
        backlog Feature plus its complete System Design and Architecture
        baseline; derives Engineering Work Packages, executable TASK
        artifacts, dependencies, affected areas, verification
        expectations, and readiness for Implementation; and stops before
        executing tasks, Implementation, Verification, Review, Delivery,
        Operate, or Feedback.
  operating_scopes:
    - id: FOUNDATION
      brain:
        [
          AGENTS.md,
          architecture.yaml,
          .agent/,
          .project/state/PROJECT-STATE.md,
          .project/roadmap/,
          .project/specs,
          .project/decisions,
          .project/decomposition,
          .project/architecture,
          .project/system-design,
          .project/engineering,
          .project/tasks,
        ]
      backlog_scope: FOUNDATION
      owns: >
        Repository architecture, agent behavior, workflows, skills,
        validation, artifact conventions, roadmap, and reusable foundation.
    - id: PROJECT
      brain_pattern: .project/projects/<project>/PROJECT.md
      backlog_scope: PROJECT
      owns: >
        Product intent, product features, app/server behavior, project
        architecture, project-specific decisions, and product delivery.
    - id: CROSS_CUTTING
      backlog_scope: CROSS_CUTTING
      owns: >
        Work that legitimately changes both foundation and project/product
        state; plans and traces must separate the two portions.
  request_routes:
    - id: FOUNDATION
      means: >
        Work on the operating layer: AGENTS.md, .agent/, .project/,
        architecture.yaml, workflow/skill/backlog/artifact/validation rules,
        or bootstrap behavior.
    - id: SEED_APP
      means: >
        Work on product behavior inside project-owned app/server/agent
        boundaries, currently the test seed project.
    - id: CROSS_CUTTING
      means: >
        Work that changes both. Foundation and app portions must stay
        separately scoped, planned, validated, and recorded.
  delivery_unit: vertical_feature_slice
  discovery_track:
    workflow: .agent/workflows/app-analysis.md
    outputs: [backlog, spec, adr, plan, feature-slice, explicit-non-goals]
  delivery_track:
    workflow: .agent/workflows/feature.md
    seed_stack_skill: .agent/skills/mern-nextjs-vertical-slice/SKILL.md
    required_order: [classify, discover, scope, plan, implement, validate, review, record]
  backlog_model:
    file: .project/backlog/BACKLOG.md
    physical_model: single_backlog
    required_columns:
      [ID, Scope, Owner, Level, Parent, Title, Kind, Status, Priority, Source, Dependencies, Notes]
    scope_values: [FOUNDATION, PROJECT, CROSS_CUTTING]
    owner_values: [repo, project-id]
    hierarchy_columns: [Level, Parent]
    state_column: Status
    rule: >
      One physical backlog remains discoverable, but every item states
      whether it maintains the foundation, a project/product, or both.
      Hierarchy is represented with Level and Parent. Workflow progress is
      represented separately with Status.

boundaries:
  - path: .agent/
    purpose: Repository-level agent operating system — how agents operate.
    contains: [instructions, workflows, skills, templates]
    is_runtime_code: false
    status: created

  - path: .project/
    purpose: Persistent engineering/project memory — what the project knows.
    contains:
      [
        context,
        discovery,
        decomposition,
        specs,
        decisions,
        engineering,
        plans,
        tasks,
        changes,
        research,
        requirements,
        projects,
        architecture,
        system-design,
        reviews,
        reports,
        roadmap,
        sessions,
        state,
        backlog,
        traces,
      ]
    created:
      [
        state,
        decisions,
        specs,
        plans,
        requirements,
        discovery,
        decomposition,
        architecture,
        system-design,
        engineering,
        tasks,
        projects,
        reviews,
        reports,
        roadmap,
        traces,
      ]
    # Remaining entries in `contains` are defined conventions
    # (.project/ARTIFACT-TYPES.md) without a directory yet — created on
    # first real need, not pre-scaffolded. See .project/README.md.
    is_runtime_code: false
    status: partially-created

  - path: apps/
    purpose: >
      User-facing deployable applications. Project-owned (ADR-013,
      principles -> project-ownership-boundary): apps/<project>/<app>,
      never apps/<app> directly.
    examples: [web, admin, mobile]
    contains: [test]
    status: created
    # First populated with the Authentication feature (ADR-012, M22),
    # corrected to a project-owned path at M23 (ADR-013): apps/test/web
    # is a Next.js/React app, the browser-facing side of the "test"
    # project's first application. Talks to servers/test/api only
    # through its own /api/** rewrite proxy, never imports servers/*
    # source directly.

  - path: servers/
    purpose: >
      Deployable server processes. Business/domain logic owned by a backend
      lives here, inside the server that owns it (e.g.
      servers/<project>/api/domains/*). Project-owned (ADR-013,
      principles -> project-ownership-boundary): servers/<project>/<server>,
      never servers/<server> directly.
    examples: [api, worker, gateway]
    contains: [test]
    status: created
    # First populated with the Authentication feature (ADR-012, M22),
    # corrected to a project-owned path at M23 (ADR-013):
    # servers/test/api is the "test" project's Express/Node/MongoDB
    # (Mongoose) server; owns auth domain logic and the auth
    # request/response contract (servers/test/api/src/domains/auth/*).

  - path: agents/
    purpose: >
      Deployable / independently executable agent applications and
      runtimes. Project-owned (ADR-013,
      principles -> project-ownership-boundary): agents/<project>/<agent>,
      never agents/<agent> directly.
      Distinct from .agent/, which is the engineering operating system, not
      a runtime.
    status: not-yet-created

  - path: packages/
    purpose: >
      Reusable SOURCE capabilities: infrastructure, protocols, transports,
      platform integrations, libraries, runtime primitives, shared
      contracts, utilities. The primary reuse boundary in this repo — but
      NOT a nested monorepo: a package under packages/<name>/ does not
      require its own package.json, tsconfig.json, or build/release
      config unless it genuinely needs independent versioning/publishing.
      The default is direct source consumption by whatever depends on it.
      If a package is ever built for distribution, its output lives
      outside the package's own source directory (e.g. a repository-level
      dist/<name>/), never inside packages/<name>/. See ADR-008.
    status: not-yet-created

  - path: infra/
    purpose: Infrastructure and deployment configuration.
    examples: [docker, kubernetes, terraform, environments]
    status: not-yet-created

  - path: tooling/
    purpose: Repository/developer tooling.
    examples: [generators, scripts, lint, build]
    contains: [git-hooks, scripts]
    status: created
    # First populated at M13: commit-msg/pre-commit/pre-push Git hooks
    # (installed via core.hooksPath, no third-party hook manager — see
    # ADR-009) and the validation scripts they and CI both call
    # (validate-architecture-boundaries.mjs, secret-scan.mjs,
    # commit-message-rules.mjs). No generator/build tooling yet — added
    # only once a concrete need creates one.

  - path: docs/
    purpose: Human-facing documentation.
    status: not-yet-created

forbidden_top_level_dirs:
  - modules
  - services
  - business-services
  - domain-services
  # Business/domain logic belongs inside the owning deployable
  # (servers/<project>/<server>/domains/*,
  # apps/<project>/<app>/features/*, etc.), not in a
  # generic root-level bucket.

dependency_direction:
  statement: >
    apps, servers, agents, and tooling may depend on packages. packages must
    not depend on apps, servers, or agents. This is a source/import
    direction, not a build or publish direction — packages/ is consumed
    directly from source by default (see boundaries -> packages/, ADR-008).
    Circular dependencies are disallowed. A package is introduced to hold a
    genuine reusable capability, never merely to break a poorly designed
    dependency graph — if a cycle appears, the boundary is reconsidered
    first.
  allowed:
    - from: apps
      to: packages
    - from: servers
      to: packages
    - from: agents
      to: packages
    - from: tooling
      to: packages
    - from: packages
      to: packages
  disallowed:
    - from: packages
      to: [apps, servers, agents]

agent_native_lifecycle:
  loop: [Observe, Understand, Plan, Act, Test, Verify, Record]
  implementation_flow:
    [
      SPEC,
      DECOMP,
      ARCHITECTURE,
      SYSTEM_DESIGN,
      ENGINEERING_DECOMPOSITION,
      PLAN,
      TASK,
      IMPLEMENT,
      TEST,
      REVIEW,
      DOCUMENT,
    ]
  status: >
    Realized as a documented protocol at M06 (work-level lifecycle: see
    .agent/instructions/development-lifecycle.md, SPEC-004) and M08
    (iterative reasoning nested inside it: see
    .agent/instructions/development-loop.md, SPEC-006 — Observe ->
    Understand -> Hypothesize -> Plan -> Change -> Verify -> Evaluate).
    Both are documentation/protocol, not a runtime. No orchestration or
    execution engine exists or is scheduled at any specific milestone —
    one is added only if a concrete need ever justifies it.

roadmap:
  current_phase: M26
  history_file: .project/roadmap/MILESTONES.yaml
  active_work:
    - BACKLOG-011
  current_milestone:
    id: M26
    name: Agent Operating Model Realignment
    status: in-progress
    spec: SPEC-014
    decisions: [ADR-015, ADR-016]
    completed_plans:
      [
        PLAN-005,
        PLAN-006,
        PLAN-007,
        PLAN-008,
        PLAN-009,
        PLAN-010,
        PLAN-011,
        PLAN-012,
        PLAN-013,
        PLAN-014,
        PLAN-015,
        PLAN-016,
        PLAN-017,
        PLAN-018,
        PLAN-019,
      ]
    trace: TRACE-030
  status: >
    Detailed milestone history moved to .project/roadmap/MILESTONES.yaml
    at M26 per ADR-015/BACKLOG-010. ADR-016 adds explicit foundation vs.
    project/product operating scope. SPEC-015 implements Intake and
    SPEC-016 implements Discovery, now corrected to require lens-based
    current-state and gap/capability analysis. SPEC-017 implements
    Specification and its clarification/rework path: blocked
    Specifications cannot enter Decomposition, clarification returns to
    the appropriate upstream phase, and Discovery-level clarification is
    recorded in Discovery before Specification is revised. architecture.yaml
    is current architecture first; roadmap history is project memory.
    SPEC-019 implements Decomposition as a feature-driven product scope map
    from a ready Specification. The current Phase 4 proof is a
    feature-driven product hierarchy: `DECOMP-*` is the reasoning/evidence
    artifact; resulting product units are represented in the existing
    backlog with explicit `Level` and `Parent` hierarchy separate from
    workflow `Status`. It is not Architecture or implementation planning.
    SPEC-020 implements Architecture as an evidence-backed phase that
    consumes Discovery, Specification, Decomposition, and backlog Features;
    `ARCH-001` selects reuse of the existing project-owned personal-notes
    architecture for the clarified baseline and stops before selected
    Feature System Design. SPEC-021 implements System Design as a
    feature-scoped phase that consumes one eligible backlog Feature and the
    high-level Architecture baseline; `SD-001` designs only `BACKLOG-014`
    (Manage owned personal notes), marks it architecturally compatible with
    impact none, and stops before Engineering Decomposition. SPEC-022
    implements Engineering Decomposition as a feature-scoped phase that
    consumes `SD-001`; `ENG-001` decomposes only `BACKLOG-014` into
    Engineering Work Packages and `TASK-001` through `TASK-005`, marks it
    ready for Implementation only after that executable Task layer exists,
    and stops before source changes.
non_goals_current_phase:
  - full agent runtime / orchestration engine
  - MCP infrastructure
  - populated package set beyond what a real feature has demonstrated
  - project generator
  - graph database
  - control panel / dashboard
  - Implementation, Verification, Review, Delivery, Operate, or Feedback
    for REQ-001 / BACKLOG-014
  - a second/subsequent application feature not yet requested
  - email verification / password reset / OAuth / MFA / audit logging
    (BACKLOG-001..003, 007, 008)
  - speculative technology or implementation-area skills
  - speculative empty architectural layers
