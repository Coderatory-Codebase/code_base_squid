# Workspace globs are for genuinely independent, publishable/deployable
# units — each needs its own package.json to be picked up here. apps/,
# servers/, and agents/ are expected to eventually hold those.
#
# packages/ is deliberately NOT globbed here: it holds reusable SOURCE
# capabilities, consumed directly (no independent package.json, build, or
# workspace membership) unless a specific package genuinely needs
# independent versioning/publishing — see architecture.yaml -> boundaries
# (packages/) and .project/decisions/ADR-008. Add a scoped glob entry for
# that one package if/when that happens; don't glob the whole directory
# speculatively.
packages:
  - "apps/*"
  - "servers/*"
  - "agents/*"
  - "tooling/*"

# Build scripts this repository explicitly allows to run (pnpm no longer
# runs a dependency's install/postinstall script by default). esbuild
# needs its native binary; mongodb-memory-server downloads a real mongod
# binary for hermetic API tests (servers/api).
allowBuilds:
  esbuild: true
  mongodb-memory-server: true
