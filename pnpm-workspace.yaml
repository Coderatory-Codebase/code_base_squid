packages:
  - "apps/*"
  - "servers/*"
  - "packages/*"
  - "prebuilt/*"
  - "prebuilt/*/*"

allowBuilds:
  esbuild: true
  mongodb-memory-server: true
  msgpackr-extract: false
  unrs-resolver: true

overrides:
  source-map-js: "1.2.2"
  "@next/eslint-plugin-next>fast-glob": "workspace:@workspace/fast-glob-compat@*"
  "@ts-morph/common>fast-glob": "workspace:@workspace/fast-glob-compat@*"
  "shadcn>fast-glob": "workspace:@workspace/fast-glob-compat@*"
  sharp: "0.35.5"
  "@modelcontextprotocol/sdk": "1.31.0"

audit:
  level: high
  ignore:
    - GHSA-vfj7-8cjw-p6xm

minimumReleaseAgeExclude:
  - source-map-js@1.2.2
  - sharp@0.35.5
  - '@modelcontextprotocol/sdk@1.31.0'
  - braces@3.0.4
