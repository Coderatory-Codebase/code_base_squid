packages:
  - "apps/*"
  - "servers/*"
  - "packages/*"
  - "prebuilt/*"
  - "prebuilt/*/*"

allowBuilds:
  esbuild: true
  mongodb-memory-server: true
  msgpackr-extract: false
  unrs-resolver: true

overrides:
  source-map-js: "1.2.2"
  sharp: "0.35.5"
  "@modelcontextprotocol/sdk": "1.31.0"
  "@next/eslint-plugin-next>fast-glob": "workspace:@workspace/fast-glob-compat@*"
  "@ts-morph/common>fast-glob": "workspace:@workspace/fast-glob-compat@*"
  "shadcn>fast-glob": "workspace:@workspace/fast-glob-compat@*"

audit:
  level: high
  # GHSA-vfj7-8cjw-p6xm: dev tooling only; remove this temporary waiver by 2026-11-03.
  ignore:
    - GHSA-vfj7-8cjw-p6xm

minimumReleaseAgeExclude:
  - braces@3.0.4
  - source-map-js@1.2.2

