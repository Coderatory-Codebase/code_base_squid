packages:
  - "apps/*"
  - "servers/*"
  - "packages/*"
  - "prebuilt/*"
  - "prebuilt/*/*"

allowBuilds:
  esbuild: true
  mongodb-memory-server: false
  msgpackr-extract: false
  unrs-resolver: true

audit:
  level: high
  # GHSA-vfj7-8cjw-p6xm: no upstream patch yet; dev tooling only (eslint-config-next and shadcn CLI); expires 2026-11-03.
  ignore:
    - GHSA-vfj7-8cjw-p6xm

minimumReleaseAgeExclude:
  - source-map-js@1.2.2
  - sharp@0.35.5
  - '@modelcontextprotocol/sdk@1.31.0'

patchedDependencies:
  braces@3.0.3: patches/braces@3.0.3.patch
